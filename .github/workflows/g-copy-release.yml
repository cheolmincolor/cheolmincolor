# Builds G-Copy for Mac and publishes it as a GitHub release, which the
# installed apps pick up through their automatic update check.
#
# To release: set the version in g-copy/desktop/package.json, write the
# notes in g-copy/desktop/RELEASE_NOTES.md and commit. Then either
#
#   - on github.com: Releases > Draft a new release > tag "g-copy-v0.7.0"
#     ("Create new tag on publish", target = the branch with that commit)
#     > Publish. This job then attaches the apps to that release; or
#   - in a terminal: git tag g-copy-v0.7.0 && git push origin g-copy-v0.7.0
#     This job then creates the release.
#
# Needs one repository secret, GCOPY_UPDATE_KEY: the private signing key
# (the whole PEM text) that matches g-copy/desktop/update-key.pem.

name: G-Copy release

on:
  push:
    tags: ['g-copy-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest   # macos-14 was not given a runner here
    defaults:
      run:
        working-directory: g-copy/desktop
    steps:
      - uses: actions/checkout@v4

      # Go 1.24 or later: older linkers leave out LC_UUID, and current macOS
      # refuses to start such programs ("dyld: missing LC_UUID").
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: g-copy/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that the tag matches the app version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "g-copy-v$v" ] || { echo "tag ${GITHUB_REF_NAME} does not match version $v"; exit 1; }

      - name: Test
        working-directory: g-copy
        run: go test ./...

      - name: Build the Mac apps
        run: |
          npm ci
          OUT=dist bash package.sh

      - name: Write and sign the update manifest
        env:
          GCOPY_UPDATE_KEY: ${{ secrets.GCOPY_UPDATE_KEY }}
        run: |
          notes=""; [ -f RELEASE_NOTES.md ] && notes=RELEASE_NOTES.md
          node make-release.mjs dist "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" $notes

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/G-Copy-*-mac-*.zip dist/latest.json dist/latest.json.sig"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # made on github.com: attach the apps, keep it marked as the latest
            gh release upload "${GITHUB_REF_NAME}" $files --clobber
            gh release edit "${GITHUB_REF_NAME}" --draft=false
            if [ -f RELEASE_NOTES.md ] && [ -z "$(gh release view "${GITHUB_REF_NAME}" --json body -q .body)" ]; then
              gh release edit "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
            fi
          else
            notes=""; [ -f RELEASE_NOTES.md ] && notes="--notes-file RELEASE_NOTES.md"
            gh release create "${GITHUB_REF_NAME}" --title "G-Copy ${GITHUB_REF_NAME#g-copy-v}" $notes $files
          fi

      # The installed apps read latest.json from one fixed place, so other
      # projects' releases in this repository never get in the way.
      - name: Update the G-Copy update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view g-copy-updates >/dev/null 2>&1; then
            gh release create g-copy-updates --target "${GITHUB_SHA}" --prerelease \
              --title "G-Copy update channel" --notes "Read by G-Copy's automatic updates. Do not delete."
          fi
          gh release upload g-copy-updates dist/latest.json dist/latest.json.sig --clobber
