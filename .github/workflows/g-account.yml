# G-Account(GRAYZONE 매출 장부) 데스크톱 앱: 테스트하고 Mac·Windows 용 zip 을 만듭니다.
# 결과 zip 은 Actions 실행 화면 아래쪽 「Artifacts」에서 받습니다.
name: G-Account

on:
  push:
    paths:
      - 'g-account/**'
      - '.github/workflows/g-account.yml'
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 새로 올리면 이전 실행은 멈춥니다.
concurrency:
  group: g-account-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: g-account

jobs:
  test-and-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Electron 받기 (테스트가 동시에 받지 않도록 미리 한 번)
        run: node -e "console.log(require('electron'))"
      - name: 테스트 (시트 규칙·로그인·화면·Electron)
        run: xvfb-run -a node --test --test-concurrency=1 test/*.test.js
      - name: Windows 용 zip
        run: TARGETS=win32-x64 bash package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: G-Account-windows
          path: g-account/dist/*.zip
          retention-days: 30

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Mac 용 zip (Apple Silicon · Intel, ad-hoc 서명)
        run: TARGETS="darwin-arm64 darwin-x64" bash package.sh
      - name: 서명된 Apple Silicon 앱이 실제로 뜨는지 확인
        run: GZ_EXE="dist/G-Account-darwin-arm64/G-Account.app/Contents/MacOS/G-Account" node --test test/electron.test.js
      - name: 자동 업데이트로 바꿔 넣은 앱도 서명이 유지되고 뜨는지 확인
        run: |
          V=$(node -p "require('./package.json').version")
          GZ_MAC_UPDATE_ZIP="dist/G-Account-$V-mac-arm64.zip" GZ_UPDATE_TARGET="$RUNNER_TEMP/apps" node --test test/mac-update.test.js
          GZ_EXE="$RUNNER_TEMP/apps/G-Account.app/Contents/MacOS/G-Account" node --test test/electron.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: G-Account-mac
          path: g-account/dist/*.zip
          retention-days: 30

  # package.json 의 버전이 올라가 있으면 GitHub 릴리스(ledger-v버전)를 만들고 zip 과 latest.json 을 올린 뒤,
  # 고정 릴리스 ledger-updates 의 latest.json 을 새 버전으로 바꿉니다. 앱은 이 고정 주소를 보고 자동 업데이트합니다.
  # 같은 버전의 릴리스가 이미 있으면 아무것도 하지 않습니다(다시 빌드한 zip 은 내용이 달라 SHA-256 이 맞지 않으므로).
  release:
    needs: [test-and-windows, mac]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: g-account/dist
          merge-multiple: true
      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="ledger-v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG 은 이미 있습니다."; exit 0; fi
          node scripts/release-manifest.js dist "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" > latest.json
          node -e "process.stdout.write(require('./latest.json').notes)" > notes.md
          gh release create "$TAG" dist/G-Account-$V-*.zip latest.json --target "$GITHUB_SHA" --title "G-Account $V" --notes-file notes.md --latest=false
          if ! gh release view ledger-updates >/dev/null 2>&1; then
            gh release create ledger-updates --prerelease --target "$GITHUB_SHA" --title "G-Account 업데이트 정보" \
              --notes "G-Account 앱이 새 버전을 찾을 때 읽는 latest.json 입니다. 설치 파일은 ledger-v… 릴리스에 있습니다."
          fi
          gh release upload ledger-updates latest.json --clobber
