# G-Retag for QuickTime 맥 앱 (예전 이름 G-ColorTag): 설치파일·업데이트 묶음을 만들고, 실제 맥에서 확인한 뒤 GitHub 릴리스로 올립니다.
# 앱은 이 릴리스(colortag-v버전)를 보고 자동 업데이트합니다.
# app.py 의 APP_VERSION 을 올리고 CHANGELOG.md 맨 위에 바뀐 점을 적어 올리면 새 릴리스가 만들어집니다.
name: G-Retag 맥 앱

on:
  push:
    paths:
      - 'g-colortag/**'
      - '.github/workflows/g-colortag.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g-colortag-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: g-colortag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 도구 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q genisoimage
          python3 -m pip install -q pillow
      - name: 설치파일·업데이트 묶음 만들기 (내려받는 파일은 체크섬 검사)
        run: bash build_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: g-colortag-release
          path: g-colortag/release/
          retention-days: 30

  mac-check:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: g-colortag-release
          path: g-colortag/release
      - name: 실제 맥에서 앱 확인 (Apple Silicon)
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app.py)
          bash test/mac_smoke.sh "release/$V/G-Retag-$V-arm64.tar.gz"
      - name: 저장한 _1-2-1 파일을 퀵타임이 (1-2-1)로 읽는지 (애플 ProRes 포함)
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app.py)
          mkdir -p "$RUNNER_TEMP/tag/Applications"
          tar -xzf "release/$V/G-Retag-$V-arm64.tar.gz" -C "$RUNNER_TEMP/tag/Applications"
          APP="$RUNNER_TEMP/tag/Applications/G-Retag.app"
          "$APP/Contents/MacOS/G-Retag-python" -I -B test/mac_tag_check.py "$APP" "$RUNNER_TEMP/native/out/tags"
      - name: 최종 확인 - 앱 저장본을 퀵타임 '동영상 속성' 창으로 읽기
        if: success() || failure()
        run: |
          python3 -m pip install --break-system-packages -q pyobjc-framework-ApplicationServices || python3 -m pip install -q pyobjc-framework-ApplicationServices
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app.py)
          mkdir -p "$RUNNER_TEMP/insp/Applications"
          tar -xzf "release/$V/G-Retag-$V-arm64.tar.gz" -C "$RUNNER_TEMP/insp/Applications"
          python3 test/mac_inspector_check.py "$RUNNER_TEMP/insp/Applications/G-Retag.app" "$RUNNER_TEMP/native/out/inspector"
      - name: 진단 - 퀵타임이 받는 색 정보 전체
        if: success() || failure()
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app.py)
          mkdir -p "$RUNNER_TEMP/dump/Applications"
          tar -xzf "release/$V/G-Retag-$V-arm64.tar.gz" -C "$RUNNER_TEMP/dump/Applications"
          APP="$RUNNER_TEMP/dump/Applications/G-Retag.app"
          "$APP/Contents/MacOS/G-Retag-python" -I -B test/mac_tag_dump.py "$APP" "$RUNNER_TEMP/native/out/dump"
      - name: 예전 G-ColorTag 3.5.0 → 자동 업데이트 → G-Retag 로 이름 바꾸기
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app.py)
          bash test/mac_migrate_check.sh "release/$V"
      - name: 영상을 '다음으로 열기'로 넘기면 목록에 들어가는지
        if: success() || failure()
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app.py)
          bash test/mac_open_check.sh "release/$V/G-Retag-$V-arm64.tar.gz"
      - name: 켜고 화면이 뜬 직후에 끄면 바로 끝나는지 (지금 배포된 버전과 비교)
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app.py)
          mkdir -p "$RUNNER_TEMP/quit/new" "$RUNNER_TEMP/quit/old"
          tar -xzf "release/$V/G-Retag-$V-arm64.tar.gz" -C "$RUNNER_TEMP/quit/new"
          NEW="$RUNNER_TEMP/quit/new/G-Retag.app"
          ARGS="확인:$NEW"
          OLDV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 40 --json tagName --jq "[.[].tagName|select(startswith(\"colortag-v\"))|select(. != \"colortag-v$V\")][0]" | sed 's/colortag-v//')
          if [ -n "$OLDV" ] && [ "$OLDV" != "$V" ] && gh release download "colortag-v$OLDV" --repo "$GITHUB_REPOSITORY" -p "G-Retag-$OLDV-arm64.tar.gz" -D "$RUNNER_TEMP/quit"; then
            tar -xzf "$RUNNER_TEMP/quit/G-Retag-$OLDV-arm64.tar.gz" -C "$RUNNER_TEMP/quit/old"
            ARGS="비교:$RUNNER_TEMP/quit/old/G-Retag.app $ARGS"
          fi
          echo "== 1) 파인더에서 여는 것처럼 (open)"
          "$NEW/Contents/MacOS/G-Retag-python" -I -B test/mac_quit_check.py $ARGS || BAD=1
          echo "== 2) 실행기를 직접 실행: 25초 타이머가 끝나기 전에 끄기"
          QUIT_MODE=direct "$NEW/Contents/MacOS/G-Retag-python" -I -B test/mac_quit_check.py $ARGS || BAD=1
          [ -z "${BAD:-}" ]
      - name: 런치 화면을 6번 연속으로 켜서 검게 뜨는 일이 없는지
        if: success() || failure()
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app.py)
          mkdir -p "$RUNNER_TEMP/rep/Applications"
          tar -xzf "release/$V/G-Retag-$V-arm64.tar.gz" -C "$RUNNER_TEMP/rep/Applications"
          APP="$RUNNER_TEMP/rep/Applications/G-Retag.app"
          BAD=0
          for i in 1 2 3 4 5 6; do
            echo "== $i 번째"
            GCT_LAUNCH_ONLY=1 "$APP/Contents/MacOS/G-Retag-python" -I -B test/mac_native_check.py "$APP" "$RUNNER_TEMP/native/out/launch_rep_$i" || BAD=$((BAD+1))
            sleep 2
          done
          echo "런치 화면 반복 결과: 6번 중 실패 $BAD 번"
          [ "$BAD" = 0 ]
      - name: 앱 미리보기가 퀵타임 플레이어와 같은 밝기인지 (실제 창 캡처, 로딩 화면 포함)
        if: success() || failure()
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app.py)
          mkdir -p "$RUNNER_TEMP/native/Applications"
          tar -xzf "release/$V/G-Retag-$V-arm64.tar.gz" -C "$RUNNER_TEMP/native/Applications"
          APP="$RUNNER_TEMP/native/Applications/G-Retag.app"
          "$APP/Contents/MacOS/G-Retag-python" -I -B test/mac_native_check.py "$APP" "$RUNNER_TEMP/native/out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g-colortag-mac-screens
          path: ${{ runner.temp }}/native/out/
          retention-days: 14

  release:
    needs: [build, mac-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: g-colortag-release
          path: g-colortag/release
      - name: 릴리스 올리기 (이미 있으면 건너뜀, 장부 앱의 '최신' 표시는 그대로)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app.py)
          TAG="colortag-v$V"; R="release/$V"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG 은 이미 있습니다."; exit 0; fi
          gh release create "$TAG" "$R"/*.dmg "$R"/*.tar.gz "$R/colortag-latest.json" \
            --target "$GITHUB_SHA" --title "G-Retag for QuickTime $V" --notes-file "$R/notes.md" --latest=false
