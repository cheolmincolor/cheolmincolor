# GRAYZONE 장부 데스크톱 앱: 테스트하고 Mac·Windows 용 zip 을 만듭니다.
# 결과 zip 은 Actions 실행 화면 아래쪽 「Artifacts」에서 받습니다.
name: GRAYZONE 장부 앱

on:
  push:
    paths:
      - 'grayzone-ledger/**'
      - '.github/workflows/grayzone-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 새로 올리면 이전 실행은 멈춥니다.
concurrency:
  group: grayzone-ledger-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: grayzone-ledger

jobs:
  test-and-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 테스트 (시트 규칙·로그인·화면·Electron)
        run: xvfb-run -a node --test test/*.test.js
      - name: Windows 용 zip
        run: TARGETS=win32-x64 bash package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GRAYZONE-Ledger-windows
          path: grayzone-ledger/dist/*.zip
          retention-days: 30

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Mac 용 zip (Apple Silicon · Intel, ad-hoc 서명)
        run: TARGETS="darwin-arm64 darwin-x64" bash package.sh
      - name: 서명된 Apple Silicon 앱이 실제로 뜨는지 확인
        run: GZ_EXE="dist/GRAYZONE Ledger-darwin-arm64/GRAYZONE Ledger.app/Contents/MacOS/GRAYZONE Ledger" node --test test/electron.test.js
      - name: 자동 업데이트로 바꿔 넣은 앱도 서명이 유지되고 뜨는지 확인
        run: |
          V=$(node -p "require('./package.json').version")
          GZ_MAC_UPDATE_ZIP="dist/GRAYZONE-Ledger-$V-mac-arm64.zip" GZ_UPDATE_TARGET="$RUNNER_TEMP/apps" node --test test/mac-update.test.js
          GZ_EXE="$RUNNER_TEMP/apps/GRAYZONE Ledger.app/Contents/MacOS/GRAYZONE Ledger" node --test test/electron.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: GRAYZONE-Ledger-mac
          path: grayzone-ledger/dist/*.zip
          retention-days: 30

  # package.json 의 버전이 올라가 있으면 GitHub 릴리스(ledger-v버전)를 만들고 zip 과 latest.json 을 올립니다.
  # 앱은 이 릴리스를 보고 자동 업데이트합니다. 같은 버전의 릴리스가 이미 있으면 아무것도 하지 않습니다.
  release:
    needs: [test-and-windows, mac]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: grayzone-ledger/dist
          merge-multiple: true
      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="ledger-v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG 은 이미 있습니다."; exit 0; fi
          node scripts/release-manifest.js dist > latest.json
          node -e "process.stdout.write(require('./latest.json').notes)" > notes.md
          gh release create "$TAG" dist/GRAYZONE-Ledger-$V-*.zip latest.json --target "$GITHUB_SHA" --title "GRAYZONE 장부 $V" --notes-file notes.md
