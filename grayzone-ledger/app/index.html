<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GRAYZONE 매출 장부</title>
<meta name="color-scheme" content="dark">
<style>
/* 어두운 바탕 하나로 씁니다(운영체제의 밝은/어두운 모드와 상관없음). */
:root {
  color-scheme: dark;
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #979590;
  --line: #2c2c2a; --axis: #383835; --fill: #262624; --btn: #f0efec; --btn-ink: #0b0b0b;
  --s1: #3987e5; --s2: #d95926;
  --bad: #f08a8a; --bad-bg: #3a1f1f; --ok: #7fd07f; --ok-bg: #1c2f1c; --wait: #e5c06a; --wait-bg: #33290f;
  --shadow: 0 6px 20px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 120px; }

header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; display: flex; align-items: center; gap: 10px; }
header h1 { font-size: 17px; letter-spacing: .04em; margin: 0; flex: 1; font-weight: 700; }
header h1 small { font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
select, .icon-btn { height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 10px; }
.icon-btn { width: 36px; padding: 0; display: grid; place-items: center; text-decoration: none; font-size: 16px; color: var(--ink); }
.busy .icon-btn.refresh i { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: 13px; font-weight: 600; color: var(--ink2); margin: 0 0 10px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; text-align: left; }
button.kpi:active { background: var(--fill); }
.kpi .label { font-size: 12px; color: var(--ink2); }
.kpi .value { font-size: 20px; font-weight: 700; margin-top: 2px; white-space: nowrap; }
.kpi .value small { font-size: 12px; font-weight: 500; color: var(--ink2); margin-left: 1px; }
.kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.readout { font-size: 13px; min-height: 20px; margin-bottom: 4px; }
.readout b { font-weight: 600; }
svg.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
svg.chart text { font-size: 11px; fill: var(--muted); }
svg.chart .hit { fill: transparent; }
svg.chart .hit.on { fill: var(--fill); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
th:first-child, td:first-child { text-align: left; }
tr:last-child td { border-bottom: 0; }
td.dim { color: var(--muted); }
tfoot td { font-weight: 600; border-top: 1px solid var(--axis); }
.meter { height: 6px; border-radius: 3px; background: var(--fill); margin-top: 5px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--s1); border-radius: 3px; }
.rank { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.rank:last-child { border-bottom: 0; }
.rank .meter { grid-column: 1 / -1; }
.rank small { color: var(--muted); margin-left: 6px; }

.tools { display: flex; gap: 8px; margin-bottom: 10px; }
.tools input[type=search] { flex: 1; min-width: 0; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--ink2); }
.chip.on { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.chips .gap { flex: 1; }

.group { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 2px 6px; font-size: 13px; color: var(--ink2); }
.group b { font-size: 15px; color: var(--ink); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.month { margin-top: 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.month .list { border: 0; border-top: 1px solid var(--line); border-radius: 0; }
.month-head { display: grid; grid-template-columns: 18px auto 1fr; align-items: center; gap: 8px; width: 100%; padding: 13px 14px; border: 0; background: none; text-align: left; font-size: 13px; color: var(--ink2); }
.month-head:hover { background: var(--fill); }
.month-head b { font-size: 15px; color: var(--ink); }
.month-head .num { text-align: right; }
.month-head .due { color: var(--bad); }
.chev { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; }
.month.open .chev { transform: rotate(90deg); }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; width: 100%; padding: 11px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; align-items: start; }
.item:last-child { border-bottom: 0; }
.item:active { background: var(--fill); }
.item .day { color: var(--muted); font-size: 12px; padding-top: 2px; min-width: 38px; }
.item .main { min-width: 0; }
.item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { font-size: 12px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .amt { text-align: right; font-weight: 600; white-space: nowrap; }
.item .tags { text-align: right; margin-top: 3px; }
.tag { display: inline-block; font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 9px; background: var(--fill); color: var(--ink2); margin-left: 3px; white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.wait { background: var(--wait-bg); color: var(--wait); }
.acts { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.acts button { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); font-size: 13px; }
.acts button.pri { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.empty { text-align: center; color: var(--muted); padding: 36px 0; }

nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav button { height: 54px; border: 0; background: none; color: var(--muted); font-size: 13px; }
nav button.on { color: var(--ink); font-weight: 700; }
nav button .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad-bg); color: var(--bad); font-size: 11px; font-weight: 600; margin-left: 4px; }
.fab { position: fixed; z-index: 7; right: max(16px, calc(50vw - 364px)); bottom: calc(70px + env(safe-area-inset-bottom)); height: 50px; padding: 0 20px; border-radius: 25px; border: 0; background: var(--btn); color: var(--btn-ink); font-weight: 700; box-shadow: var(--shadow); }

.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.65); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); border: 1px solid var(--line); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
@media (min-width: 620px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
.sheet h3 { margin: 0 0 4px; font-size: 17px; }
.sheet .sub { color: var(--ink2); font-size: 13px; margin-bottom: 12px; }
.facts { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; font-size: 14px; margin: 12px 0 16px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label.f { display: block; font-size: 12px; color: var(--ink2); margin-bottom: 10px; min-width: 0; }
label.f input, label.f select, label.f textarea { display: block; width: 100%; height: 42px; margin-top: 4px; border: 1px solid var(--axis); border-radius: 10px; background: var(--surface); padding: 0 10px; font-size: 16px; }
label.f textarea { height: 64px; padding: 8px 10px; resize: vertical; }
label.check { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 0 0 12px; }
details { margin-bottom: 12px; }
summary { font-size: 13px; color: var(--ink2); padding: 6px 0 10px; cursor: pointer; }
.btns { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.btn { flex: 1; min-width: 96px; height: 46px; border-radius: 12px; border: 1px solid var(--axis); background: var(--surface); font-weight: 600; }
.btn.pri { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.danger { color: var(--bad); flex: 0 0 auto; }
.btn:disabled { opacity: .5; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.seg button { height: 40px; border-radius: 10px; border: 1px solid var(--axis); background: var(--surface); }
.seg button.on { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }

.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(132px + env(safe-area-inset-bottom)); background: var(--btn); color: var(--btn-ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; padding: 0; white-space: nowrap; }
.loading { text-align: center; color: var(--muted); padding: 80px 0; }
.updatebar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--s1); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
.updatebar[hidden] { display: none; }
.updatebar span { flex: 1; }
.updatebar button { height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--btn); color: var(--btn-ink); font-weight: 600; white-space: nowrap; }
.updatebar button.x { background: transparent; color: var(--muted); padding: 0 6px; font-size: 18px; }
.notes { white-space: pre-wrap; font-size: 12px; color: var(--ink2); background: var(--fill); border-radius: 10px; padding: 10px; margin-top: 8px; max-height: 160px; overflow: auto; }
.banner { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--wait-bg); background: var(--wait-bg); color: var(--wait); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
.banner b { color: var(--wait); }
.banner span { color: var(--ink2); }
.banner .go { color: var(--wait); font-weight: 600; }
.card h2 .h2note { font-weight: 400; color: var(--muted); margin-left: 6px; }
.scroll-x { overflow-x: auto; }
table.vat td .cap { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 1px; }
table.vat tr.sub td { background: var(--fill); font-weight: 600; }
table.vat td.warn { color: var(--wait); }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.note.center { text-align: center; }
.hint { display: block; min-height: 16px; margin-top: 4px; font-size: 12px; color: var(--muted); }
.sheet h4 { font-size: 13px; color: var(--ink2); margin: 18px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.issues { margin: 10px 0 0; }
.issue { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--wait-bg); color: var(--wait); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-bottom: 6px; }
.issue button { flex: 0 0 auto; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--wait); background: transparent; color: var(--wait); font-size: 12px; }
body.setup { padding-top: 0; }
body.setup nav, body.setup .fab, body.setup #year, body.setup #sheetLink, body.setup #refresh { display: none; }
.steps { max-width: 560px; margin: 8px auto 0; }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 0 12px; }
.step .no { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--fill); color: var(--ink2); }
.step.done .no { background: var(--ok-bg); color: var(--ok); }
.step.now .no { background: var(--btn); color: var(--btn-ink); }
.step h2 { font-size: 15px; color: var(--ink); margin: 4px 0 4px; }
.step p { margin: 0 0 10px; color: var(--ink2); font-size: 13px; }
.step .btn { flex: 0 0 auto; min-width: 140px; height: 40px; }
.step .ok { color: var(--ok); font-size: 13px; font-weight: 600; }
.step input { width: 100%; height: 40px; border: 1px solid var(--axis); border-radius: 10px; background: var(--surface); padding: 0 10px; margin-bottom: 8px; }
.intro { text-align: center; color: var(--ink2); font-size: 14px; margin: 6px 0 18px; }
@media (min-width: 720px) {
  body { padding-top: 50px; }
  nav { top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); padding-bottom: 0; }
  nav .in { grid-template-columns: repeat(3, 120px); justify-content: center; }
  nav button { height: 50px; }
  header { top: 50px; }
  .wrap { padding-bottom: 96px; }
  .fab { bottom: 24px; }
  .toast { bottom: 90px; }
}

/* ---------- 인체공학: 크게 누르고, 크게 읽고, 덜 움직이게 ---------- */
:root { --head: 64px; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
/* 누르는 곳 */
select, .icon-btn { height: 40px; }
.icon-btn { width: 40px; }
.icon-btn i { font-style: normal; display: inline-block; }
.icon-btn .lbl { display: none; font-size: 13px; }
.chip { height: 36px; padding: 0 14px; }
.acts button { height: 38px; padding: 0 14px; font-size: 14px; }
.tools input[type=search] { height: 44px; font-size: 15px; }
.item { padding: 13px 14px; cursor: pointer; }
.item:hover, button.kpi:hover { background: var(--fill); }
.month-head { padding: 15px 14px; }
/* 읽는 글씨 */
.item .day, .item .s, .kpi .label, .kpi .sub, label.f, .legend, th { font-size: 13px; }
.tag { font-size: 12px; line-height: 20px; padding: 0 7px; }
table { font-size: 14px; }
.note, table.vat td .cap, .hint { font-size: 12.5px; }
/* 스크롤해도 어느 달인지 보이게: 달 머리줄이 위에 붙어 따라옵니다 */
.month { overflow: visible; }
.month-head { position: sticky; top: var(--head); z-index: 2; background: var(--surface); border-radius: 14px; }
.month.open .month-head { border-radius: 14px 14px 0 0; }
.month .list { border-radius: 0 0 14px 14px; }
/* 긴 입력 창에서도 저장 버튼이 늘 보이게 */
.sheet > .btns:has(+ .err), .sheet > .btns:last-child { position: sticky; bottom: -18px; background: var(--surface); padding: 10px 0 18px; margin-bottom: -18px; z-index: 1; }
.sheet > .err { position: sticky; bottom: 60px; background: var(--surface); z-index: 1; }
.sheet > .err:empty { position: static; }
@media (min-width: 720px) {
  :root { --head: 114px; }
  /* 등록 버튼은 위쪽 탭 줄 오른쪽에: 목록을 가리지 않습니다 */
  .fab { top: 6px; bottom: auto; height: 38px; padding: 0 16px; border-radius: 10px; box-shadow: none; font-size: 14px; }
  .toast { top: 58px; bottom: auto; }  /* 아래쪽 저장 버튼을 가리지 않게 위에 */
  .wrap { padding-bottom: 40px; }
  /* 아이콘 옆에 이름 */
  .icon-btn { width: auto; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; }
  .icon-btn .lbl { display: inline; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GRAYZONE<small>매출 장부</small></h1>
    <select id="year" aria-label="연도"></select>
    <a class="icon-btn" id="sheetLink" target="_blank" rel="noopener" title="시트 열기 (⌘⇧O)" aria-label="시트 열기"><i>▦</i><span class="lbl">시트</span></a>
    <button class="icon-btn refresh" id="refresh" title="새로 고침 (⌘R)" aria-label="새로 고침"><i>↻</i><span class="lbl">새로 고침</span></button>
    <button class="icon-btn" id="settings" title="설정 (⌘,)" aria-label="설정"><i>⚙</i><span class="lbl">설정</span></button>
  </header>
  <div id="updateBar" class="updatebar" role="status" hidden></div>
  <main id="app"><div class="loading">장부를 불러오는 중…</div></main>
</div>
<button class="fab" id="add" title="작업 등록 (⌘N)">+ 작업 등록</button>
<nav><div class="in">
  <button data-tab="home">요약</button>
  <button data-tab="ledger">장부</button>
  <button data-tab="unpaid">미수금<span class="badge" id="unpaidBadge" hidden></span></button>
</div></nav>
<div id="modal"></div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
